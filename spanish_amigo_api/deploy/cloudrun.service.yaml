apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: spanish-amigo-api
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 120
      serviceAccountName: REPLACE_WITH_SERVICE_ACCOUNT_EMAIL
      containers:
        - image: REPLACE_WITH_IMAGE_URI
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: ENV
              value: production
            - name: FIREBASE_PROJECT_ID
              value: spanishamigo-8016a
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_API_KEY
                  key: latest
