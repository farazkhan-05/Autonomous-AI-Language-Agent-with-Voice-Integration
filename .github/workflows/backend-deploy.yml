name: Backend Deploy (Cloud Run)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "spanish_amigo_api/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE }}
  REPOSITORY: ${{ secrets.ARTIFACT_REPOSITORY }}
  IMAGE_NAME: spanish-amigo-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deploy configuration
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ALLOWED_CORS_ORIGINS: ${{ secrets.ALLOWED_CORS_ORIGINS }}
        run: |
          set -euo pipefail

          missing=0
          require_value() {
            if [ -z "${!1:-}" ]; then
              echo "::error::$1 is missing or empty"
              missing=1
            fi
          }

          require_value PROJECT_ID
          require_value REGION
          require_value SERVICE_NAME
          require_value REPOSITORY
          require_value WIF_PROVIDER
          require_value DEPLOY_SERVICE_ACCOUNT
          require_value DATABASE_URL
          require_value GEMINI_API_KEY
          require_value FIREBASE_PROJECT_ID
          require_value ALLOWED_CORS_ORIGINS

          if ! [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error::GCP_PROJECT_ID must be a valid Google Cloud project ID"
            missing=1
          fi

          if ! [[ "$REGION" =~ ^[a-z]+-[a-z]+[0-9]$ ]]; then
            echo "::error::GCP_REGION should look like us-central1"
            missing=1
          fi

          if ! [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/.+/providers/.+$ ]]; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER must be the full provider resource path"
            missing=1
          fi

          if ! [[ "$DEPLOY_SERVICE_ACCOUNT" =~ ^[^@]+@[^@]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::GCP_SERVICE_ACCOUNT_EMAIL must be a service account email"
            missing=1
          fi

          if [[ "$ALLOWED_CORS_ORIGINS" != *","* ]]; then
            echo "::warning::ALLOWED_CORS_ORIGINS contains a single origin. Add both localhost and frontend production URL if needed."
          fi

          exit "$missing"

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        working-directory: spanish_amigo_api
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Setup Python for migrations
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Run Alembic migrations
        working-directory: spanish_amigo_api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      - name: Deploy to Cloud Run
        run: |
          ENV_VARS_FILE="$(mktemp)"
          cat > "${ENV_VARS_FILE}" <<EOF
          ENV: "production"
          LOG_LEVEL: "INFO"
          FIREBASE_PROJECT_ID: "${{ secrets.FIREBASE_PROJECT_ID }}"
          ALLOWED_CORS_ORIGINS: "${{ secrets.ALLOWED_CORS_ORIGINS }}"
          AUTH_ALLOW_INSECURE_DEV_TOKENS: "false"
          EOF

          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "$IMAGE_URI" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --env-vars-file "${ENV_VARS_FILE}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"

          rm -f "${ENV_VARS_FILE}"

      - name: Verify Cloud Run health endpoint
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --format="value(status.url)")
          echo "Service URL: ${SERVICE_URL}"
          curl -fsS "${SERVICE_URL}/health"
