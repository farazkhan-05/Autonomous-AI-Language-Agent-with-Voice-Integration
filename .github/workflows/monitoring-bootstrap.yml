name: Monitoring Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE }}
  NOTIFICATION_CHANNELS: ${{ secrets.GCP_MONITORING_NOTIFICATION_CHANNELS }}

jobs:
  bootstrap-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate monitoring inputs
        run: |
          set -euo pipefail

          missing=0
          require_value() {
            if [ -z "${!1:-}" ]; then
              echo "::error::$1 is missing or empty"
              missing=1
            fi
          }

          require_value PROJECT_ID
          require_value REGION
          require_value SERVICE_NAME
          require_value NOTIFICATION_CHANNELS
          require_value GCP_WORKLOAD_IDENTITY_PROVIDER
          require_value GCP_SERVICE_ACCOUNT_EMAIL

          exit "$missing"
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Apply dashboard and alert policies
        run: |
          chmod +x spanish_amigo_api/deploy/monitoring/setup_monitoring.sh
          bash spanish_amigo_api/deploy/monitoring/setup_monitoring.sh
