version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Disable broad version-update PR spam; keep dependency security checks in CI.
    # Security updates are managed separately by GitHub and are not controlled by this limit.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "pip"
    directory: "/spanish_amigo_api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
